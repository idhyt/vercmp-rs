[package]
name = "vercmp-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
alpm-version = { path = "../alpm-version" }
apk-version = { path = "../apk-version" }
cran-version = { path = "../cran-version" }
debian-version = { path = "../debian-version" }
luarocks-version = { path = "../luarocks-version" }
maven-version = { path = "../maven-version" }
opam-version = { path = "../opam-version" }
rpm-version = { path = "../rpm-version" }
semantic-version = { path = "../semantic-version" }

version-compare = "0.2.1"

[build-dependencies]
ws-build = { path = "../ws-build" }
cbindgen = { version = "0.29.2", optional = true }

# [lib]
# name = "vercmp"
# crate-type = [
#     "cdylib",
#     # "rlib",
#     # "staticlib"
# ]

[features]
default = []
# Generate Rust FFI bindings for invoking C libraries
generate-bindings = ["ws-build/generate-bindings"]
# Generate C FFI interface for calling Rust from C
generate-capi = ["cbindgen"]
